name: Bug
description: Something doesn't work as it should.
type: Bug
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens vs. what should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "P0 · Wrong card, lost data or a solver started unasked: fix now"
        - "P1 · A module is broken, no workaround"
        - "P2 · Annoying, has a workaround"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Material, module and computer
      placeholder: "GG630 · REPO · LS-DYNA computer"
