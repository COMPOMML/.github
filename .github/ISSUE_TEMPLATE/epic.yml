name: Epic
description: A group of stories and tasks toward a milestone.
type: Feature
labels: ["epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What COMPO can do when this is done, and why it matters now.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
