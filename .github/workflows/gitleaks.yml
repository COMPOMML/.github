# Reusable secret scan using the gitleaks CLI (not gitleaks-action, which needs a
# paid license for organizations). Scans the full git history; a `.gitleaks.toml`
# at the repo root is picked up automatically.
#
# Usage:
#   jobs:
#     gitleaks:
#       uses: COMPOMML/.github/.github/workflows/gitleaks.yml@main
#
# Runner (optional): defaults to GitHub-hosted ubuntu-latest. To pick another runner,
# pass a JSON value for `runs-on`, e.g. a label list:
#       with:
#         runner: '["self-hosted","compo"]'
# Use a custom runner only from private repos, never from public ones.
name: gitleaks

on:
  workflow_call:
    inputs:
      runner:
        description: JSON value for runs-on (a label string or a list of labels).
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-gitleaks
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum --check --strict
          tar -xzf "$f" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git --redact --verbose --exit-code 1 .
